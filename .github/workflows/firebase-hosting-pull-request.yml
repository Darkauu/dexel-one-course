# Vista previa de cada PR en una URL temporal (7 días), comentada en el propio PR.
name: Firebase Hosting · vista previa

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    # Los PR desde forks no tienen acceso al secreto.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIPO3D_COURSE_F40BF }}
          projectId: tripo3d-course-f40bf
          expires: 7d
